name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Core Test Suite & Evidence Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete pytest suite
        run: |
          pytest -v -W default

      - name: Verify signed evidence bundle with trusted repository public key
        run: |
          python -m benchmark.evidence verify benchmark/runs/run-20261014-185014/bundle --trusted-public-key keys/trusted_lab_signer.pub.pem
